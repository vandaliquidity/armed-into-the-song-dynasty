 chapters:[
  {zh:'第一章 · 清河村，开杀',en:'Ch.1 · Blood at Qinghe Village',place:'qinghe',
   sub:{zh:'宣和四年。五人落在秦州陇山，身体竟年轻了许多。山下的清河村，西夏兵正在劫掠。',en:'Xuanhe 4 (1122). The five wake in the Long Mountains of Qinzhou — somehow younger. Below them, Xia soldiers are sacking Qinghe Village.'},
   goal:{zh:'冲下山坡，击退劫掠清河村的西夏兵，保住粮仓与村民',en:'Charge down the slope, drive the Xia raiders out of Qinghe, save the granary and villagers'},
   brief:{zh:'西夏兵会在备战倒计时结束后从北、西、东北三条路同时杀来。乡勇和村民守在两侧有墙的窄巷里时受伤 -35%、攻击 +15%（头顶出现小盾牌）。',en:'When the prep countdown ends the Xia attack from the north, west and north-east roads all at once. Militia and villagers standing in a narrow lane with walls on both sides take 35% less damage and hit 15% harder (a small shield shows above them).'},
   intro:[['marks','这是穿越了吧？','We have... time-travelled, right?'],['eng','啥穿越，咱这是重生！你看我这手，年轻了十岁。','Time travel nothing — we were reborn! Look at my hands, ten years younger.'],
     ['comms','地上全是野兽蹄印，闻不到一点现代的味道。不是地方远，是年代远。','Animal tracks everywhere and no smell of the modern world. It is not that we are far away — we are far back.'],
     ['lead','那边是秦州陇山，今年是宣和四年。村子着火了——西夏兵。子弹打一发少一发，冲！','This is the Long Mountains of Qinzhou, Xuanhe year four. The village is burning — Xia troops. Every round is one we never get back. Go!']],
   waves:[['西边田里有几个落单的西夏兵——先拿他们练练手！','A few stray Xia soldiers in the western fields — warm up on them!'],['西夏兵在劫掠清河村！','Xia soldiers are sacking Qinghe!'],['第二拨：弓手压上来了','Second band: archers advancing'],['东北方又来一队，游骑绕向西侧！','Another band from the north-east, raiders circling west!'],['西夏游骑头目亲至！','The Xia raider chief rides in!']],
   assault:{zh:'西夏游骑头目吹响号角——北、西、东北三路一齐杀进清河村！',en:'The raider chief sounds his horn — the Xia storm Qinghe from the north, west and north-east at once!'},
   scouts:['村西来了三个西夏探子！左键点敌人＝近战，右键点敌人＝开枪','Three Xia scouts west of the village! Left-click an enemy = melee, right-click an enemy = shoot'],
   win:{zh:'清河村保住了。周里正推举林队为乡兵社头，五人在清河村落户。',en:'Qinghe is saved. Elder Zhou names Captain Lin head of the village militia, and the five settle in Qinghe.'},
   reward:{zh:'缴获西夏战马 · 解锁村寨经营 · 6名青壮自愿入乡勇',en:'Captured Xia war-horses · village management unlocked · 6 young men join the militia'}},
  {zh:'第二章 · 秦陇初行',en:'Ch.2 · The Road to Qinzhou',place:'qinzhou',
   sub:{zh:'陇城寨只肯出三十贯一匹，秦州能卖到七十贯。林队决定亲自押着战马和车队，经清水县去秦州。',en:'Longcheng Fort offers only 30 strings of cash per horse; Qinzhou pays 70. Captain Lin decides to take the horses and wagons to Qinzhou himself, by way of Qingshui County.'},
   goal:{zh:'护送车队向东抵达秦州方向（至少一辆）；沿途救援石家部',en:'Get the wagons east toward Qinzhou (at least one); rescue the Shi clan settlement on the way'},
   intro:[['elder','卖给慕恩，价低，可总归稳。自己跑秦州，钱多，路上却未必稳。','Sell to Mu En and the price is low, but safe. Haul them to Qinzhou and the money is better — the road is not.'],
     ['lead','清河村缺的不只是这一笔钱。粮、盐、药材、铁料都要备，秦州什么行情，得亲眼去看。','Qinghe needs more than this one sale. Grain, salt, medicine, iron — and I need to see Qinzhou with my own eyes.'],
     ['marks','哥，路上要是有不长眼的，交给我。','If anyone on the road gets ideas, brother, leave them to me.']],
   ev:[['山梁上有伏兵！','Ambush on the ridge!'],['前方游骑截道！','Raiders blocking the road ahead!'],['重甲骑兵！长枪手在前，结枪阵！','Heavy cavalry! Spearmen to the front — spear wall!']],
   rescue:{zh:'石家部得救！{n}名青壮愿随车队同行',en:'The Shi clan settlement is saved! {n} men join the convoy'},
   win:{zh:'战马在秦州官马场卖出好价。城里，林队遇见在街头卖身葬母的红缨，收留了她。车队满载物资，与红缨、李奎一同返回清河村。',en:'The horses fetch a good price at the Qinzhou official horse market. In the city, Captain Lin meets Hongying, selling herself to bury her mother, and takes her in. The loaded convoy returns to Qinghe with Hongying and Li Kui.'},
   reward:{zh:'红缨、李奎加入（第三章出战） · 解锁骑兵',en:'Hongying and Li Kui join (fight in Ch.3) · cavalry unlocked'}},
  {zh:'第三章 · 清河血战',en:'Ch.3 · The Battle of Qinghe',place:'qinghe',
   sub:{zh:'西夏千人队直扑清河村。妇孺随青禾上山躲避，村墙由马哥把守，后队骑兵埋伏在坡上。',en:'A Xia thousand-man host falls on Qinghe. The women and children go up the hill with Miss Xu, Big Ma holds the village wall, and a mounted reserve waits on the slope.'},
   goal:{zh:'守住清河村，击杀西夏头领，令敌军崩溃',en:'Hold Qinghe, kill the Xia commander and break their army'},
   intro:[['elder','探子回报：西夏人来了上千，步跋子、游骑，还有拐子马。','Scouts say over a thousand Xia are coming — infantry, horse archers, and flanking heavy horse.'],
     ['eng','墙头交给俺！佛朗机装好了，那铁皮车也加满了最后一桶油。','Leave the wall to me! The cannon are loaded, and the Warrior has our last can of fuel.'],
     ['lead','守村的顶住，坡上的人等我信号。头领一死，他们就会散。','The wall holds; the riders on the slope wait for my signal. Once their commander falls, they will scatter.']],
   waves:[['西夏前锋到了！','The Xia vanguard arrives!'],['敌军抬来砲车，要轰塌村墙！','They are bringing up catapults to batter the wall!'],['拐子马冲阵！长枪手结阵在前！','Heavy horse charging! Spearmen form up in front!'],['西夏头领亲率中军压上！','The Xia commander leads the main body in!']],
   assault:{zh:'西夏千人队与头领中军一齐压上，三面攻村！',en:'The whole Xia host and its commander storm Qinghe from three sides at once!'},
   relief:{zh:'李奎、红缨率骑兵从坡上冲下！',en:'Li Kui and Hongying charge down the slope with the riders!'},
   bossRage:{zh:'西夏头领：拐子马，随我破阵！',en:'Xia commander: "Heavy horse — break their line!"'},
   bossDie:{zh:'西夏头领被斩！敌军一溃千里！',en:'The Xia commander is slain! Their army breaks and flees!'},
   win:{zh:'西夏千人队崩溃，一溃千里。清河村被烧塌了半边，但总归还活着。战后全村祭奠死难乡勇与村民。',en:'The Xia host breaks and flees for miles. Half of Qinghe is burnt, but the village lives. Afterwards the whole village mourns its fallen militia and villagers.'},
   reward:{zh:'第一卷《清河扬威》序章完',en:'Prologue of Volume 1 "Qinghe Rises" complete'}},
 ],
 route:['qinghe','qingshui','qinzhou','qingshui','qinghe','longcheng','xian','huizhou','youzhou'],
 teasers:[{place:'longcheng',zh:'清河起势 · 陇城整军',en:'Qinghe Rises · Drilling at Longcheng'},{place:'qinzhou',zh:'边地风雷',en:'Thunder on the Frontier'},

 ending:{zh:'清河村在血火中站住了脚。狄县令将亲来清河村祭奠，陇城的风云就要卷到这几个年轻人身上——而北边的宋金之盟，正在养一头更凶的狼。<br><b>未完待续……</b>',
   en:'Qinghe has held, through fire and blood. Magistrate Di will come to honour the dead, and the storms of Longcheng are about to break over these young men — while in the north, the Song–Jin alliance is raising a fiercer wolf.<br><b>To be continued...</b>'},
 tips:[{zh:'提示：左键选中/拖框多选，右键点地面移动，左键点敌人近战，右键点敌人开枪。队员会自动迎击最近的敌人。','en':'Tip: left-click or drag to select, right-click ground to move, left-click an enemy to melee, right-click an enemy to shoot. Units engage the nearest enemy on their own.'},
   {zh:'提示：车队遇敌会停下。长枪手在“驻守+枪阵”时能挡住骑兵冲锋。','en':'Tip: wagons halt when enemies are near. Spearmen on Hold + Spear wall stop cavalry charges.'},
   {zh:'提示：按 F 开北汽勇士冲阵——原著里正是这辆“铁皮怪车”冲垮了西夏人。砲车射程远，派骑兵或老谢优先清除。','en':'Tip: press F and drive the BAIC Warrior into their ranks — in the story it was this "iron monster cart" that broke the Xia. Catapults outrange you: send cavalry or Old Xie after them.'}],

function mEnv(g,t,a,peak,dec){g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+dec);}

function iGong(t,v,f=98){// tam-tam / opera gong: inharmonic partials, slow decay, the pitch sags a little
  for(const[r,a,d]of[[1,1,4],[1.48,.6,3],[1.98,.45,2.6],[2.44,.35,2.2],[3.1,.25,1.6],[4.2,.15,1.2]]){const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(f*r*1.02,t);o.frequency.exponentialRampToValueAtTime(f*r*.985,t+d);mEnv(g,t,.012,v*a*.5,d);o.connect(g);mOut(g,1);o.start(t);o.stop(t+d+.1);}

  if(bend){o.frequency.linearRampToValueAtTime(f*Math.pow(2,bend/12),t+dur*.5);o2.frequency.linearRampToValueAtTime(f*2*Math.pow(2,bend/12),t+dur*.5);}

  const f=mfreq(m),o=AC.createOscillator(),g=AC.createGain(),lfo=AC.createOscillator(),lg=AC.createGain();

function musTick(){if(!AC||!MUS.bus||AC.state!=='running')return;if(MUS.next<AC.currentTime-1)MUS.next=AC.currentTime+.05;

function musStep(t,s,bar){const st=MSTYLE[MUS.mode],md=MUS.mode,sp=60/st.bpm/4,R=st.root;

function passable(team,tx,ty){if(!inB(tx,ty))return false;const v=B.solid[tIdx(tx,ty)];if(v===0)return true;if(v===2){const s=B.structs[B.sgrid[tIdx(tx,ty)]];return team===0&&s.def.pass0;}return false;}
function blockedPx(x,y,r,team){const k=r*.7;for(const[dx,dy]of[[-k,-k],[k,-k],[-k,k],[k,k]]){if(!passable(team,Math.floor((x+dx)/TS),Math.floor((y+dy)/TS)))return true;}return false;}
// ---------------------------------------------------------------- flow fields (Dijkstra; enemies may route "through" structures at a cost)
function flowField(team,gx,gy,exact){let tx=clamp(Math.floor(gx/TS),0,B.W-1),ty=clamp(Math.floor(gy/TS),0,B.H-1);if(!exact){const q=2;tx=clamp(Math.floor(tx/q)*q+1,0,B.W-1);ty=clamp(Math.floor(ty/q)*q+1,0,B.H-1);}
  const key=team+':'+tx+','+ty;let f=B.flowCache[key];if(f&&f.gen===B.flowGen)return f;
  if(!exact){if((B.flowBudget|0)<=0)return null;B.flowBudget--;}
  if(Object.keys(B.flowCache).length>160){for(const k in B.flowCache)if(B.flowCache[k].gen!==B.flowGen||Math.random()<.3)delete B.flowCache[k];}
  B.flowN=(B.flowN||0)+1;const W=B.W,H=B.H,N=W*H,d=new Float64Array(N).fill(1e9);const heap=[];const push=(i,v)=>{heap.push([v,i]);let k=heap.length-1;while(k>0){const p=(k-1)>>1;if(heap[p][0]<=heap[k][0])break;[heap[p],heap[k]]=[heap[k],heap[p]];k=p;}};
  const pop=()=>{const top=heap[0],last=heap.pop();if(heap.length){heap[0]=last;let k=0;for(;;){const l=k*2+1,r=l+1;let m=k;if(l<heap.length&&heap[l][0]<heap[m][0])m=l;if(r<heap.length&&heap[r][0]<heap[m][0])m=r;if(m===k)break;[heap[m],heap[k]]=[heap[k],heap[m]];k=m;}}return top;};
  const s0=tIdx(tx,ty);d[s0]=0;push(s0,0);
  const cost=i=>{const v=B.solid[i];if(v===0)return 1;if(v===1)return -1;const s=B.structs[B.sgrid[i]];if(team===0)return s.def.pass0?1:-1;return 2+s.hp/45;};
  while(heap.length){const[v,i]=pop();if(v>d[i])continue;const x=i%W,y=(i/W)|0;
    for(let k=0;k<8;k++){const nx=x+DX8[k],ny=y+DY8[k];if(nx<0||ny<0||nx>=W||ny>=H)continue;const j=ny*W+nx;const c=cost(j);if(c<0)continue;
      if(k>=4){if(cost(y*W+nx)<0||cost(ny*W+x)<0)continue;}
      const nv=v+c*(k>=4?1.414:1);if(nv<d[j]){d[j]=nv;push(j,nv);}}}
  f={gen:B.flowGen,d};B.flowCache[key]=f;return f;}
const DX8=[1,-1,0,0,1,1,-1,-1],DY8=[0,0,1,-1,1,-1,1,-1];
function flowStep(f,u){const tx=Math.floor(u.x/TS),ty=Math.floor(u.y/TS);if(!inB(tx,ty))return null;let best=f.d[tIdx(tx,ty)],bi=-1;
  for(let k=0;k<8;k++){const nx=tx+DX8[k],ny=ty+DY8[k];if(!inB(nx,ny))continue;const v=f.d[tIdx(nx,ny)];if(v<best-.01){best=v;bi=k;}}
  if(bi<0)return null;return{tx:tx+DX8[bi],ty:ty+DY8[bi]};}
function losClear(team,x0,y0,x1,y1){const d=Math.hypot(x1-x0,y1-y0),n=Math.ceil(d/14);for(let i=1;i<n;i++){const t=i/n;if(!passable(team,Math.floor((x0+(x1-x0)*t)/TS),Math.floor((y0+(y1-y0)*t)/TS)))return false;}return true;}
// ---------------------------------------------------------------- units
function snapFree(team,x,y){if(!B||!B.solid)return[x,y];const tx=Math.floor(x/TS),ty=Math.floor(y/TS);if(!inB(tx,ty)||passable(team,tx,ty))return[x,y];let best=null,bd=1e9;for(let r=1;r<7&&!best;r++)for(let yy=ty-r;yy<=ty+r;yy++)for(let xx=tx-r;xx<=tx+r;xx++){if(!inB(xx,yy)||!passable(team,xx,yy))continue;const d=Math.hypot(xx-tx,yy-ty);if(d<bd){bd=d;best=[(xx+.5)*TS,(yy+.5)*TS];}}return best||[x,y];}

  u.door=null;
  if(alive(u.fear)){const a=angTo(u.fear,u);moveUnit(u,Math.cos(a)*u.def.spd*1.4,Math.sin(a)*u.def.spd*1.4,dt);return;}

function updCart(u,dt){u.flash-=dt;let scared=false;query(u.x,u.y,110,o=>{if(o.team===1&&!o.dead)scared=true;});u.scared=scared;
  if(scared||!B.road){moveUnit(u,0,0,dt);return;}let wp=B.road[u.wp];if(!wp){moveUnit(u,0,0,dt);return;}
  if(Math.hypot(wp.x-u.x,wp.y-u.y)<20){u.wp++;wp=B.road[u.wp];if(!wp)return;}

  const ahead=B.carts.find(c=>c!==u&&!c.dead&&c.x>u.x&&c.x-u.x<70&&Math.abs(c.y-u.y)<60);const sp=ahead?0:u.def.spd;
  const a=Math.atan2(wp.y-u.y,wp.x-u.x);u.x+=Math.cos(a)*sp*dt;u.y+=Math.sin(a)*sp*dt;u.face=a;u.anim+=sp*dt/14;}

function updateBattle(dt){if(!B||B.paused||B.over&&B.overT>2.5)return;B.t+=dt;if(B.abil)abilTick(dt);if(B.over)B.overT=(B.overT||0)+dt;

    if(u.cart){updCart(u,dt);continue;}
    if(u.kind==='civ'){updCiv(u,dt);continue;}

  B.ustT=(B.ustT||0)-dt;if(B.ustT<=0){B.ustT=1;for(const u of B.units){if(u.dead||u.inVeh||u.kind==='veh'||u.cart||u.team===3)continue;const tx=Math.floor(u.x/TS),ty=Math.floor(u.y/TS);if(passable(u.team,tx,ty))continue;
    B.stuckFix=(B.stuckFix||0)+1;let best=null,bd=1e9;for(let r=1;r<5&&!best;r++)for(let yy=ty-r;yy<=ty+r;yy++)for(let xx=tx-r;xx<=tx+r;xx++){if(!passable(u.team,xx,yy))continue;const d=Math.hypot(xx-tx,yy-ty);if(d<bd){bd=d;best=[xx,yy];}}

  // towers shoot
  for(const s of B.structs){if(s.dead)continue;s.flash-=dt;if(!s.def.shoot)continue;s.cd-=dt;if(s.cd<=0){const t=nearestFoe({x:s.x,y:s.y,team:0},260,null);if(t){shoot({x:s.x,y:s.y-40,team:0,def:{dmg:12},face:0},'tbolt',t.x,t.y,{dmg:13,pierce:.5});s.cd=1.6;}else s.cd=.4;}}
  // juma spikes hurt mounted enemies that touch them
  for(const s of B.structs){if(s.dead||!s.def.juma)continue;query(s.x,s.y,40,o=>{if(o.team===1&&!o.dead&&o.def.mounted&&Math.abs(o.x-s.x)<o.r+18&&Math.abs(o.y-s.y)<o.r+18){if((o.jumaT||0)<B.t){o.jumaT=B.t+.6;damage(o,18,null,{kind:'melee'});}}});}
  if(B.events)for(const e of B.events)if(!e.done&&e.c()){e.done=true;e.f();}
  updWaves(dt);if(B.waves.length&&B.stallDone!==B.wave)stallBreak();

  if(B.hamlet&&!B.hamlet.done){let n=0;query(B.hamlet.x,B.hamlet.y,420,o=>{if(o.team===1&&!o.dead)n++;});const near=B.squad.some(q=>!q.dead&&Math.hypot(q.x-B.hamlet.x,q.y-B.hamlet.y)<500)||Math.hypot(B.ctrlBody().x-B.hamlet.x,B.ctrlBody().y-B.hamlet.y)<500;
    if(n===0&&near){B.hamlet.done=true;const alive=B.civs.filter(c=>!c.dead&&Math.hypot(c.x-B.hamlet.x,c.y-B.hamlet.y)<500).length;const join=4+alive;for(let i=0;i<join;i++)mkUnit('militia',0,B.hamlet.x+rnd(-60,60),B.hamlet.y+rnd(20,60));B.rescued=join;say(LORE.chapters[1].rescue.zh.replace('{n}',join),LORE.chapters[1].rescue.en.replace('{n}',join),3.5);sfx('win');}}
  // particles
  for(let i=B.parts.length-1;i>=0;i--){const p=B.parts[i];p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.k==='blood'){p.vy+=260*dt;}else if(p.k==='dust'||p.k==='smoke'){p.vx*=.96;p.vy*=.96;}if(p.t>=p.life){if(p.k==='blood'&&Math.random()<.3)B.decals.push({k:'drop',x:p.x,y:p.y,r:p.sz*1.3,a:.7,t:0});B.parts.splice(i,1);}}
  for(let i=B.decals.length-1;i>=0;i--){const d=B.decals[i];d.t+=dt;if(d.t>40)B.decals.splice(i,1);}if(B.decals.length>500)B.decals.splice(0,B.decals.length-500);
  for(let i=B.texts.length-1;i>=0;i--){B.texts[i].t-=dt;if(B.texts[i].t<=0)B.texts.splice(i,1);}

function addPalisade(){const[x0,y0,x1,y1]=VIL.palisade;
  const gapH=(x,y)=>(x>=39&&x<=41)||(x>=26&&x<=28&&y===y1)||(x>=49&&x<=50&&y===y0);   // street, ford lane, broken stretch
  const gapV=(x,y)=>(y>=28&&y<=30)||(y>=20&&y<=21&&x===x1)||(y>=47&&y<=48&&x===x0);
  for(let x=x0;x<=x1;x++)for(const y of[y0,y1]){if(gapH(x,y))continue;addProp('palisade',(x+.5)*TS,(y+.55)*TS,0);solidT(x,y);}
  for(let y=y0+1;y<y1;y++)for(const x of[x0,x1]){if(gapV(x,y))continue;addProp('palisade',(x+.5)*TS,(y+.55)*TS,1);solidT(x,y);}}

  for(const[x0,y0,x1,y1]of B.vil.pens){g.fillStyle='rgba(120,92,56,.55)';g.fillRect(x0*T,y0*T,(x1-x0+1)*T,(y1-y0+1)*T);for(let i=0;i<30;i++){g.fillStyle='rgba(206,176,96,.6)';g.fillRect(rnd(x0,x1+1)*T,rnd(y0,y1+1)*T,rnd(3,8),2);}}

  const sy=x=>(VIL.stream+Math.sin(x/7)*.8+.5)*T;const sline=(w,st)=>{g.strokeStyle=st;g.lineWidth=w;g.lineCap='round';g.beginPath();for(let x=-1;x<=81;x++){const px=x*T,py=sy(x);x>-1?g.lineTo(px,py):g.moveTo(px,py);}g.stroke();};
  sline(92,'rgba(110,104,60,.55)');sline(72,'rgba(86,70,46,.9)');sline(56,'#4d6a72');sline(38,'#5d808a');sline(14,'rgba(170,200,210,.35)');

  for(const[x0,y0,x1,y1]of VIL.lanes)if(x0>0&&y1-y0<2)lane([[x0+.5,(y0+y1)/2+.5],[x1+.5,(y0+y1)/2+.5]],(y1-y0+1)*T*.95);
  lane([[27.5,48],[27.5,57],[24,63]],1.4*T);
  const fl=(r,k,rad)=>{const[x0,y0,x1,y1]=r;g.fillStyle='rgba(110,84,52,.3)';rr(x0*T-6,y0*T-6,(x1-x0+1)*T+12,(y1-y0+1)*T+12,rad+6);g.fill();g.fillStyle=pat(k);rr(x0*T,y0*T,(x1-x0+1)*T,(y1-y0+1)*T,rad);g.fill();};

  {const[x0,y0,x1,y1]=VIL.threshing,cx=(x0+x1+1)/2*T,cy=(y0+y1+1)/2*T;g.fillStyle='rgba(110,84,52,.3)';g.beginPath();g.ellipse(cx,cy,(x1-x0+1)/2*T+6,(y1-y0+1)/2*T+6,0,0,TAU);g.fill();g.fillStyle=pat('floor');g.beginPath();g.ellipse(cx,cy,(x1-x0+1)/2*T,(y1-y0+1)/2*T,0,0,TAU);g.fill();
    g.strokeStyle='rgba(150,120,80,.35)';g.lineWidth=2;for(let r=30;r<(x1-x0)*T/2;r+=22){g.beginPath();g.ellipse(cx,cy,r,r*(y1-y0+1)/(x1-x0+1),0,0,TAU);g.stroke();}
    for(let i=0;i<160;i++){g.fillStyle='rgba(214,184,100,.55)';const a=rnd(TAU),r=rnd((x1-x0)*T*.48);g.fillRect(cx+Math.cos(a)*r,cy+Math.sin(a)*r*.8,rnd(3,9),1.5);}}
  for(const y of B.vil.yards)fl(y,'floor',6);for(const[x,y]of B.vil.thresholds){g.fillStyle=pat('floor');g.fillRect(x*T+2,(y-1)*T,T-4,T*2.6);}
  // a few cart ruts and a scatter of straw on the lanes
  for(let i=0;i<220;i++){const p=pick(B.vil.lanePts);g.fillStyle='rgba(214,184,100,.5)';g.fillRect(p.x+rnd(-40,40),p.y+rnd(-14,14),rnd(3,7),1.5);}
  // granary yard: a ring of trodden straw around it
  {const k=B.key;if(k){g.fillStyle='rgba(200,170,96,.35)';g.beginPath();g.ellipse(k.x,k.y+10,70,46,0,0,TAU);g.fill();}}

// ---------------------------------------------------------------- v0.4 narrow-lane detection (walls on both sides, free run <= 2 tiles)
function computeNarrow(){const W=B.W,H=B.H,n=new Uint8Array(W*H);const sol=(x,y)=>!inB(x,y)||B.solid[tIdx(x,y)]!==0;
  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){if(sol(x,y))continue;
    let l=x,r=x;while(x-l<3&&!sol(l-1,y))l--;while(r-x<3&&!sol(r+1,y))r++;const hn=r-l+1<=2&&sol(l-1,y)&&sol(r+1,y)&&l-1>0&&r+1<W-1;
    let u=y,d=y;while(y-u<3&&!sol(x,u-1))u--;while(d-y<3&&!sol(x,d+1))d++;const vn=d-u+1<=2&&sol(x,u-1)&&sol(x,d+1)&&u-1>0&&d+1<H-1;
    if(hn||vn)n[tIdx(x,y)]=1;}
  B.narrow=n;B.narrowGen=B.flowGen;}
function inNarrow(u){if(!B.narrow)return false;const tx=Math.floor(u.x/TS),ty=Math.floor(u.y/TS);return inB(tx,ty)&&B.narrow[tIdx(tx,ty)]===1;}
const NARROW_DEF=.65,NARROW_ATK=1.15;
function narrowBonus(u){return u&&u.team===0&&(u.kind==='troop'||u.kind==='civ')&&!u.cart&&inNarrow(u);}
// ===== v0.4 RTS controls: selection, click orders, free camera, autonomous squad AI =====
const SEL={drag:null,last:{t:0,id:-1},groups:{},lastKey:{k:null,t:0}};
const SQ_MELEE=.66,SQ_TAKE=1.0,SQ_TAKE_LATE=.65;const SQ_ACQ=230,SQ_LEASH=280;
function selectable(u){return !!u&&!u.dead&&u.team===0&&(u.kind==='squad'||u.kind==='troop')&&!u.cart&&!u.inVeh;}
function selList(){const a=[];for(const u of B.selU)if(selectable(u))a.push(u);return a;}
function syncSel(){for(const u of [...B.selU])if(!selectable(u))B.selU.delete(u);B.sel=new Set([...B.selU].filter(u=>u.kind==='troop').map(u=>u.type));}
function setSel(arr,add){if(!add)B.selU=new Set();for(const u of arr)if(selectable(u))B.selU.add(u);syncSel();if(arr.length)sfx('click');if(B.tut&&!B.tut.done)tutSel();}
function s2w(sx,sy){return{x:sx/CAM.z+CAM.x,y:sy/CAM.z+CAM.y};}
function pickUnit(wx,wy,filt){let best=null,bd=1e9;for(const u of B.units){if(u.dead||u.inVeh||u.gone||!filt(u))continue;const cy=u.y-u.r*.8,d=Math.hypot(u.x-wx,(cy-wy)*.8);const R=u.r*1.25+8;if(d<R&&d<bd){bd=d;best=u;}}return best;}
function onScreen(u){const p=w2s(u.x,u.y);return p.x>-10&&p.x<VW+10&&p.y>-10&&p.y<VH+10;}
// ---------------------------------------------------------------- orders
// formation slots: breadth-first over walkable tiles from the click, two men per tile -> the group pours into lanes naturally
function formSlots(n,wx,wy){let tx=clamp(Math.floor(wx/TS),0,B.W-1),ty=clamp(Math.floor(wy/TS),0,B.H-1);
  if(!passable(0,tx,ty)){let bd=1e9,bt=null;for(let r=1;r<6&&!bt;r++)for(let y=ty-r;y<=ty+r;y++)for(let x=tx-r;x<=tx+r;x++){if(!passable(0,x,y))continue;const d=Math.hypot(x-tx,y-ty);if(d<bd){bd=d;bt=[x,y];}}if(!bt)return null;[tx,ty]=bt;wx=(tx+.5)*TS;wy=(ty+.5)*TS;}
  const out=[],seen=new Set([tIdx(tx,ty)]);let q=[[tx,ty]];const per=2,OFF=[[-7,-4],[7,4]];
  while(q.length&&out.length<n){const nq=[];q.sort((a,b)=>Math.hypot(a[0]+.5-wx/TS,a[1]+.5-wy/TS)-Math.hypot(b[0]+.5-wx/TS,b[1]+.5-wy/TS));
    for(const[x,y]of q){for(let k=0;k<per&&out.length<n;k++){const cx=out.length===0?wx:(x+.5)*TS+OFF[k][0],cy=out.length===0?wy:(y+.5)*TS+OFF[k][1];out.push({x:cx,y:cy});}
      for(let k=0;k<4;k++){const nx=x+DX8[k],ny=y+DY8[k];if(!inB(nx,ny))continue;const i=tIdx(nx,ny);if(seen.has(i)||!passable(0,nx,ny))continue;seen.add(i);nq.push([nx,ny]);}}
    q=nq;}
  return out;}
function cmdMove(units,wx,wy,quiet){const sl=formSlots(units.length,wx,wy);if(!sl)return;const left=new Set(units);
  const f=(()=>{let cx=0,cy=0;for(const u of units){cx+=u.x;cy+=u.y;}return Math.atan2(wy-cy/units.length,wx-cx/units.length);})();
  for(const s of sl){let best=null,bd=1e9;for(const u of left){const d=Math.hypot(u.x-s.x,u.y-s.y);if(d<bd){bd=d;best=u;}}if(!best)break;left.delete(best);best.ord={type:'move',x:s.x,y:s.y,f};best.tgt=null;}
  if(!quiet){B.clickFx.push({x:wx,y:wy,t:0,c:'#7dff9a'});sfx('order');}
  if(B.tut&&!B.tut.done)B.tut.moved=1;B.stats.cmds=(B.stats.cmds||0)+1;}
function cmdAttack(units,tgt,mode){let n=0;
  for(const u of units){if(u.kind==='squad'){u.ord={type:'attack',tgt,gun:mode==='fire'};n++;}else{u.ord={type:'attack',tgt};n++;}}

    if(o==='xia'||o==='jin')CG.queue.push({type:a.raid?'raid':'atk',army:a.id,terr:to});else if(o==='free'){if(Math.random()<.5)CG.queue.push({type:'claim',army:a.id,terr:to});else{moves.push([a,to]);claimTerr(to);}}else moves.push([a,to]);a.dest=null;}
  for(const[a,to]of moves){CG.anim.push({a:a.id,from:a.loc,to,t:0});a.loc=to;}
  for(const x of CG.xa)if(x.eta<=0)CG.queue.push({type:'def',xa:x.id,terr:x.to,story:x.story});
  sfx('drum');campRefresh();if(CG.tut===4&&!CG.queue.length)CG.tut=5;}

  if(!quiet)cgLog('🚩',Ts(CL.ev.taken.zh.replace('{t}',CT[id].zh),CL.ev.taken.en.replace('{t}',CT[id].en)));campRefresh();}
function stockTxt(g){return Object.keys(g).filter(k=>g[k]).map(k=>{const n=RAWN[k]||EQN[k]||(k==='silver'?['银','silver','🪙']:[k,k,'']);return `${n[2]||''}${g[k]}`;}).join(' ');}
function loseTerr(id){const s=CG.T[id];for(const u of unitsAt(id))delete CG.U[u.id];s.stock={horse:Math.round(s.st.horse*.6),silver:20,grain:Math.round(s.st.grain*.6),spear:s.eq.spear,dao:s.eq.dao,bow:s.eq.bow,armL:s.eq.armL,hide:Math.round(s.st.hide*.6)};for(const k of RAW)s.st[k]=Math.round(s.st[k]*.2);for(const k of EQ)s.eq[k]=0;s.trn=[];s.own='xia';s.str=Math.max(300,s.str||300);s.prosp=Math.max(5,s.prosp-30);s.build=null;const ks=DEV_ORDER.filter(k=>s.bld[k]>0);if(ks.length)s.bld[pick(ks)]--;CG.stats.lost++;

function qItem(){return CG.queue[0];}
function qArmy(q){if(q.story)return CG.armies.find(a=>a.cmd==='lead');return q.army?CG.armies.find(a=>a.id===q.army):armyAt(q.terr);}
function qEnemyStr(q){if(q.type==='def'){const x=CG.xa.find(x=>x.id===q.xa);return x?x.str:200;}if(q.type==='claim')return 120+rint(0,120);const s=Math.max(100,CG.T[q.terr].str);return q.type==='raid'?Math.round(s*.55):s;}
function enemyMix(str,kind,N=10){const n=Math.max(6,Math.min(230,Math.round(str/N)));const m={xfoot:0,xarch:0,xraid:0,xiron:0,xcamel:0};
  m.xiron=str>800?Math.round(n*.1):0;m.xcamel=(kind==='city'||kind==='fort')&&str>1000?Math.min(4,Math.round(n*.03)):0;m.xraid=Math.round(n*(kind==='camp'||kind==='pass'?.26:.16));m.xarch=Math.round(n*.22);m.xfoot=Math.max(2,n-m.xiron-m.xcamel-m.xraid-m.xarch);return m;}
function qUnits(q){const a=qArmy(q);const us=a?armyUnits(a).slice():[];if(q.type==='def')for(const u of unitsAt(q.terr))if(!us.includes(u))us.push(u);return us;}
function powerOf(a,q){let p=0;const us=a?armyUnits(a).slice():[];if(q&&q.type==='def')for(const u of unitsAt(q.terr))if(!us.includes(u))us.push(u);for(const u of us)p+=unitPow(u)*100;const mem=a?a.mem:[];let rk=0;for(const m of mem)rk+=CG.sq[m].rank;p+=mem.length*60*(1+.12*rk);
  if(q&&q.type==='def'){const s=CG.T[q.terr];p+=s.pop*.03;p*=1+.2*s.bld.wall;}return p*(a?a.morale/100:1);}
function autoResolve(q){const E=qEnemyStr(q)*1.1;const a=qArmy(q);const P=powerOf(a,q);const pe=P*rnd(.85,1.15),ee=E*rnd(.85,1.15);const win=pe>ee;
  const frac=win?clamp(.45*ee/(pe+ee),.04,.35):clamp(.7*pe/(pe+ee)+.25,.3,.8);const kills=Math.round(win?E*rnd(.45,.7):E*rnd(.15,.3));
  return resolveBattle(q,win,{frac:()=>frac*rnd(.7,1.2),kills,auto:1,mounted:Math.round(kills*.12),saved:win&&q.type==='def'?Math.round(CG.T[q.terr].pop*.05):0,t:0,mkills:{}});}
function resolveBattle(q,win,r){const a=qArmy(q),id=q.terr,s=CG.T[id],P=perkSum();CG.stats.battles++;if(win)CG.stats.wins++;
  // v0.7: casualties split into dead and wounded; the wounded convalesce over the seasons (see woundTick / 医馆)
  const su=!!(a&&a.mem.includes('medic'));const wf=clamp(.36+(su?.16:0)-(r.auto?.06:0)+P.heal*.3,.12,.72);let lostN=0,back=0,wnd=0;const us=qUnits(q);
  for(const u of us){const f=r.frac?r.frac(u):0;const l=Math.min(u.men,Math.round(u.men*f));const w=Math.round(l*wf);u.men-=l;u.wnd=(u.wnd||0)+w;lostN+=l-w;wnd+=w;u.exp+=win?2:1;u.mor=clamp(u.mor+(win?5:-20),20,100);
    if(u.men+u.wnd<10&&!(u.men>0&&typeof carePending==='function'&&carePending(u.id)>0)){if(a)a.units=a.units.filter(i=>i!==u.id);delete CG.U[u.id];}}
  const gain={grain:0,silver:0,ore:0,horse:0,rep:0};const lm=1+P.loot;const dst=owned(id)?id:a&&owned(a.loc)?a.loc:HOME;
  if(win){gain.silver=Math.round((r.kills*.15+(r.loot?r.loot.silver*2:0))*lm);gain.ore=Math.round((r.kills*.06+(r.loot?r.loot.iron*2:0))*lm);gain.grain=Math.round(r.kills*.2*lm);gain.horse=Math.round(r.mounted*.08*lm);
    gain.rep=4+P.rep+(r.t&&r.t<150?3:0)+(q.type==='def'?3:0);}
  else gain.rep=-3;
  CAMP.res.silver+=gain.silver;CAMP.res.rep=Math.max(0,(CAMP.res.rep||0)+gain.rep);
  const mem=a?a.mem:[];for(const m of mem){const mk=(r.mkills&&r.mkills[m])||0;CG.sq[m].merit+=Math.round((win?(r.auto?14:28):6)+mk*1.5+(m==='lead'&&win?8:0));}
  for(const m of mem)if(canPromote(m)&&!(CG.promoNote||{})[m]){(CG.promoNote=CG.promoNote||{})[m]=1;const sd=SQUAD.find(x=>x.id===m);cgLog('🎖',Ts(CL.ev.promo.zh.replace('{n}',sd.zh),CL.ev.promo.en.replace('{n}',sd.en)));}
  let stock=null;
  if(q.type==='atk'||q.type==='claim'){if(win){const st0=s.stock?{...s.stock}:null;claimTerr(id);stock=st0;s.prosp=Math.max(15,Math.round(s.prosp*.7));a.from=a.loc;CG.anim.push({a:a.id,from:a.loc,to:id,t:0});a.loc=id;}else{a.morale=Math.max(40,a.morale-25);}}
  else if(q.type==='raid'){if(win){stock=lootStock(id,.6,a.loc&&owned(a.loc)?a.loc:HOME);CG.stats.raids++;s.str=Math.round(s.str*.8);cgLog('🐎',Ts(`劫营${CT[id].zh}得手：`,`Raid on ${CT[id].en}: `)+stockTxt(stock));}else a.morale=Math.max(40,a.morale-20);}
  else{const x=CG.xa.find(x=>x.id===q.xa);CG.xa=CG.xa.filter(o=>o!==x);if(win){s.prosp=Math.min(100,s.prosp+3);if(x&&x.story==='ch3'){for(const k in CG.T)if(CG.T[k].own==='xia')CG.T[k].str=Math.round(CG.T[k].str*.7);}}else{if(x&&x.story==='ch3'){s.prosp=Math.max(10,s.prosp-30);}else if(id===HOME&&s.prosp>20){s.prosp-=22;s.raided=1;s.st.grain=Math.round(s.st.grain*.7);CAMP.res.silver=Math.round(CAMP.res.silver*.75);s.pop=Math.round(s.pop*.9);cgLog('🔥',Ts(CL.ev.sacked.zh,CL.ev.sacked.en));}else loseTerr(id);}}
  if(win&&CG.T[dst]&&CG.T[dst].st){CG.T[dst].st.grain+=gain.grain;CG.T[dst].st.ore+=gain.ore;CG.T[dst].st.horse+=gain.horse;}
  if(a&&!a.units.length&&!a.mem.length){CG.armies=CG.armies.filter(x=>x!==a);}else if(a&&a.cmd!=='lead'&&!a.units.length)mergeArmyHome(a);
  CG.last={q:{...q},win,gain,lostN,back,wnd,su,kills:r.kills,auto:!!r.auto,terr:id,t:r.t||0,saved:r.saved||0,horses:gain.horse,stock};CG.queue.shift();if(!CG.queue.length&&CG.tut===4)CG.tut=5;campRefresh();syncRes();saveGame();return CG.last;}

  campRefresh();const inc=income();rep.trade=inc.trade;rep.up=inc.up;
  // yields land in each village's own storehouses; silver/powder/renown go to the treasury
  for(const id in CG.T){if(!owned(id))continue;const y=terrYield(id),s=CG.T[id];for(const k of RAW)if(y[k])s.st[k]=(s.st[k]||0)+y[k];CAMP.res.silver+=y.silver;CAMP.res.powder=(CAMP.res.powder||0)+y.powder;CAMP.res.rep=(CAMP.res.rep||0)+y.rep;}
  CAMP.res.silver+=inc.trade;CAMP.res.silver-=inc.up.silver;if(CAMP.res.silver<0){CAMP.res.silver=0;for(const u of Object.values(CG.U))u.mor=Math.max(20,u.mor-10);rep.lines.push(['⚠',Ts('欠饷！士气下降','Pay in arrears: morale falls')]);}

  // food: garrisons eat from their own village; armies from the supply network
  let starving=false;for(const u of Object.values(CG.U)){const need=Math.round(unitGrain(u));let at=u.loc&&u.loc.v?u.loc.v:null;if(u.loc?.bannerTransfer&&typeof bannerUnitAt==='function'){const stop=bannerUnitAt(u);at=stop&&owned(stop)?stop:HOME;}if(!at){const a=CG.armies.find(x=>x.id===(u.loc&&u.loc.a));at=a?(owned(a.loc)?a.loc:HOME):HOME;}
    const got=take(at,'grain',need,false);const rest=need-got;if(rest>0){let g2=0;for(const v of netIds(at)){g2+=take(v,'grain',rest-g2,false);if(g2>=rest)break;}if(g2<rest){starving=true;u.mor=Math.max(20,u.mor-15);u.men=Math.max(10,Math.round(u.men*.95));}}}
  if(starving)rep.lines.push(['⚠',Ts('军粮不继','The troops go hungry')]);
  for(const a of CG.armies){if(!armySupplied(a)){a.morale=Math.max(30,a.morale-12);for(const u of armyUnits(a))u.men=Math.max(10,Math.floor(u.men*.94));}else a.morale=Math.min(100,a.morale+10);}

  // logistics and industry: caravans move raw materials on trade roads, then workshops work, then barracks finish training
  caravans(rep);const made=produce(rep);for(const k in made)CG.stats.made+=made[k];finishTraining(rep);
  for(const id in CG.T){const s=CG.T[id];if(!owned(id))continue;const cap=storeCap(id);for(const k of['grain','ore','timber','hide','leather','stone','salt','nitre'])if(s.st[k]>cap){rep.lines.push(['🐀',Ts(`${CT[id].zh}仓满，${RAWN[k][0]}霉损`,`${CT[id].en}: storehouse full, ${RAWN[k][1].toLowerCase()} spoils`)]);s.st[k]=cap;}}
  for(const id in CG.T){const s=CG.T[id];const t0=tierOf(s.prosp);
    if(owned(id)){const rt=ROUTES.filter(r=>r.a===id||r.b===id).length;s.held=(s.held||0)+1;let d=2+Math.min(3,s.held*.25)+s.bld.market*1.2+s.bld.farm*.8+rt*2+(s.bld.wall?.5:0)+(s.fest?3:0)-(SUPP.has(id)?0:5)-(s.st.grain<=0?4:0)-(s.raided?12:0);
      if(id===HOME)d+=1;s.prosp=clamp(s.prosp+d,0,100);const g=s.pop*.035*(s.prosp/50)*(1+P.popG)*(s.st.grain<=0?-.5:1);s.pop=Math.round(clamp(s.pop+g,200,popCap(id)));}

function netIds(id){// villages joined to id by the supply network (own land, passing through Song towns)
  if(!SUPP.has(id))return [id];const out=[],seen=new Set([id]),q=[id];while(q.length){const a=q.shift();if(owned(a))out.push(a);for(const b of CADJ[a])if(!seen.has(b)&&SUPP.has(b)){seen.add(b);q.push(b);}}return out;}
function routeIds(id){// villages reachable from id along trade roads (for raw materials)
  const out=[id],seen=new Set([id]),q=[id];while(q.length){const a=q.shift();for(const r of ROUTES){const b=r.a===a?r.b:r.b===a?r.a:null;if(b&&!seen.has(b)&&owned(b)){seen.add(b);out.push(b);q.push(b);}}}return out;}
function have(id,k,net){if(EQ.includes(k)){let n=0;for(const v of netIds(id))n+=CG.T[v].eq[k]||0;return n;}
  if(k==='silver'||k==='rep'||k==='powder')return CAMP.res[k]||0;const ids=net?routeIds(id):[id];let n=0;for(const v of ids)n+=CG.T[v].st[k]||0;return n;}
function take(id,k,n,net){if(n<=0)return 0;if(k==='silver'||k==='rep'||k==='powder'){CAMP.res[k]-=n;return n;}
  const isEq=EQ.includes(k);const ids=isEq?netIds(id):net?routeIds(id):[id];let left=n;
  for(const v of ids){const box=isEq?CG.T[v].eq:CG.T[v].st;const g=Math.min(left,box[k]||0);box[k]=(box[k]||0)-g;left-=g;if(left<=0)break;}return n-left;}
function canPayAt(id,c){for(const k in c){const kk=k==='iron'?'ore':k;if(have(id,kk,true)<c[k])return false;}return true;}
function payAt(id,c){for(const k in c){const kk=k==='iron'?'ore':k;take(id,kk,c[k],true);}}

    s.str=Math.round((t.str||10)*({village:25,fort:25,pass:30,camp:40,town:30,city:50}[t.kind]||25));}

  else if(s.own==='free'){s.st.grain=Math.round(s.pop*.12);s.st.hide=30;s.st.timber=40;}}

function consolidate(us,onGone){const by={};for(const u of us){const k=u.type+'|'+u.arm;(by[k]=by[k]||[]).push(u);}
  for(const k in by){const g=by[k].filter(u=>u.men<100).sort((a,b)=>b.men-a.men);let i=0,j=g.length-1;while(i<j){const a=g[i],b=g[j];const m=Math.min(100-a.men,b.men);if(m<=0){i++;continue;}
    a.exp=Math.round((a.exp*a.men+b.exp*m)/(a.men+m));a.mor=Math.round((a.mor*a.men+b.mor*m)/(a.men+m));a.men+=m;b.men-=m;if(b.men<=0){delete CG.U[b.id];if(onGone)onGone(b);j--;}if(a.men>=100)i++;}}}
function unitSite(u){if(u.loc&&u.loc.v)return u.loc.v;const a=CG.armies.find(x=>x.id===(u.loc&&u.loc.a));return a&&owned(a.loc)?a.loc:null;}

function caravans(rep){// raw materials flow along trade roads to the workshops that need them

function cvilLayout(){const id=CVIL.id,s=CG.T[id],R=srand([...id].reduce((a,c)=>a*31+c.charCodeAt(0),7));const L={houses:[],trees:[],stalls:[],ban:[]};

function walkTo(p,spd,dt){const d=Math.hypot(p.tx-p.x,p.ty-p.y);if(d<4){p.wait-=dt;if(p.wait<=0){const w=pick(CVIL.wp);p.tx=w.x+rnd(-14,14);p.ty=w.y+rnd(-6,6);p.wait=rnd(1.5,5);p.load=w.k==='store'||w.k==='field'?!p.load:p.load;}return false;}
  const a=Math.atan2(p.ty-p.y,p.tx-p.x);p.x+=Math.cos(a)*Math.min(d,spd*dt);p.y+=Math.sin(a)*Math.min(d,spd*dt);p.f=a;p.ph+=dt*spd/30;return true;}
function vstep(p,spd,dt,x0,y0,x1,y1){if(!p.tx||Math.hypot(p.tx-p.x,p.ty-p.y)<6||Math.random()<dt*.05){p.tx=rnd(x0,x1);p.ty=rnd(y0,y1);}const a=Math.atan2(p.ty-p.y,p.tx-p.x);p.x+=Math.cos(a)*spd*dt;p.y+=Math.sin(a)*spd*dt;p.f=a;p.ph+=dt*spd/30;}

  const R=B.skirm?(B.skirm.mode==='def'?600:900):B.ch===1?460:B.ch===2?620:520;if(B.abil&&H.at!==undefined){H.at-=.7;}botAbil(H);const th=threatsNear(G,R);const c=centroid(sq);
  // squad: target the nearest threat; shoot archers, horsemen and chiefs, melee the rest
  if(th.length){let t=th[0];const key=th.find(o=>o.name||o.def.boss||o.def.heavy||o.def.structMul);if(key&&Math.hypot(key.x-G.x,key.y-G.y)<R*.8)t=key;
    const ammoOK=!melee&&B.mod.ammo>(B.ch===0?40:30);const shoot=ammoOK&&(t.def.range||t.def.mounted||t.name||t.def.boss||t.def.heavy||th.length>6);
    const cur=L.ord&&L.ord.type==='attack'&&alive(L.ord.tgt)?L.ord.tgt:null;
    if(cur!==t||(H.mode!==(shoot?'fire':'melee'))){botKey('1');if(sloppy&&Math.random()<.25)botClick(2,t.x+rnd(-60,60),t.y+rnd(-60,60));else botClickUnit(shoot?2:0,t);H.mode=shoot?'fire':'melee';}
    if(!sloppy){let n=0;query(t.x,t.y,90,o=>{if(o.team===1&&!o.dead)n++;});if(n>=5&&B.mod.gren>0&&(H.gt||0)<H.t&&Math.hypot(t.x-c.x,t.y-c.y)<320){botSee(t.x,t.y);const p=w2s(t.x,t.y);MOUSE.x=p.x;MOUSE.y=p.y;botKey('q');H.gt=H.t+4;}
      if(L.skE<=0&&th.filter(o=>Math.hypot(o.x-L.x,o.y-L.y)<200).length>=4){botClickUnit(0,L);botKey('e');botKey('1');}}
    // troops: send group 2 at whatever is hitting the objective
    if(!sloppy&&H.mt<=0){H.mt=3;const close=threatsNear(G,B.ch===2?300:260);if(close.length){botKey('2');if(selList().length)botClickUnit(0,close[0]);botKey('1');}}}
  else{// quiet: regroup at the post / follow the convoy
    if(B.ch===1){const al=B.carts.filter(c=>!c.dead).sort((a,b)=>b.x-a.x)[0];let tx=al?al.x+140:L.x,ty=al?al.y-30:L.y;if(B.hamlet&&!B.hamlet.done&&al&&Math.abs(al.x-B.hamlet.x)<700){tx=B.hamlet.x;ty=B.hamlet.y+40;}
      if(Math.hypot(c.x-tx,c.y-ty)>160){botKey('0');botClick(2,tx,ty);botKey('1');}}
    else if(Math.hypot(c.x-H.post.x,c.y-H.post.y)>220){botKey('1');botClick(2,H.post.x,H.post.y);if(!sloppy&&B.ch===0&&H.mt<=0){H.mt=6;botKey('2');if(selList().length)botClick(2,B.key.x,B.key.y-60);botKey('1');}}}}
function botAbil(H){if(!B.abil||!B.abil.length)return;H.abT=(H.abT||0)-.7;if(H.abT>0)return;H.abT=3;const sq=B.squad.filter(u=>!u.dead);const c=centroid(sq);const th=threatsNear(c,400);
  for(const a of B.abil){if(a.cd>0)continue;if(a.id==='rally'&&B.units.some(u=>u.team===0&&u.kind==='troop'&&!u.dead&&u.hp<u.maxhp*.6)){useAbil('rally');return;}
    if(a.id==='shieldwall'&&th.length>=6){useAbil('shieldwall');return;}if(a.id==='drums'&&th.length>=8){useAbil('drums');return;}
    if((a.id==='volley'||a.id==='flank')&&th.length>=4){const t=th[0];useAbil(a.id,t.x,t.y);return;}if(a.id==='overwatch'&&th.length>=3){useAbil('overwatch');return;}}}

function cbotDevelop(){const H=CG.T[HOME];
  for(const k of['forge','barracks','workshop','clinic','granary']){const lv=CAMP.bld[k];if(lv<2){const c=BLD[k].lv[lv];if(canAfford(c)&&CAMP.res.silver-(c.silver||0)>60){pay(c);CAMP.bld[k]++;break;}}}
  const wantH=['store','lumber','quarry','yard','hosp','smithy','tannery','armour','bowyer','farm','market','stable','saddle','bowyer','fire','smithy','market','armour','yard','wall','farm','store','tower'];
  const wantV=['farm','lumber','market','store','yard','stable','smithy','wall','farm','market','tannery','tower','store','yard'];
  for(const id in CG.T){if(!owned(id))continue;const s=CG.T[id],d=CT[id];if(s.gov&&s.gauto&&s.gauto.build)continue;if(building(id).length>=buildSlots(id))continue;let k=null;
    for(const w of(id===HOME?wantH:wantV)){const lv=s.bld[w]||0;if(lv>=DEV[w].c.length||building(id).some(b=>b.k===w))continue;if(id!==HOME){if(w==='smithy'&&d.trait!=='iron')continue;if(w==='stable'&&d.trait!=='horse')continue;if(w==='tannery'&&d.trait!=='horse')continue;if(w==='wall'&&!CADJ[id].some(b=>CG.T[b].own==='xia'))continue;if(w==='yard'&&tierOf(s.prosp)<1&&d.kind==='village')continue;}
      const c=devCost(w,lv);if(c&&canPayAt(id,c)&&(CAMP.res.silver-(c.silver||0))>30){k=w;break;}}if(k)startBuild(id,k);}
  for(const n of NODES)if(owned(n.terr)&&!CG.out[n.id]&&canPayAt(n.terr,OUTPOST_COST)&&CAMP.res.silver>60)buildOutpost(n.id);
  cbotOrders();cbotTrade();}
function cbotOrders(){const T0=realmTotals().eq;for(const id in CG.T){if(!owned(id))continue;const s=CG.T[id];
  if(s.bld.smithy)setOrder(id,'smithy',T0.spear<T0.dao*3+200?'spear':'dao');if(s.bld.bowyer)setOrder(id,'bowyer',s.bld.bowyer>=2&&T0.xbow<T0.bow?'xbow':'bow');

function cbotTrade(){for(const id in CG.T){if(!owned(id)||marketLv(id)<1)continue;const s=CG.T[id];let g=0;while(s.st.grain>Math.max(600,storeCap(id)*.7)&&g++<10)sellRaw(id,'grain');

function cbotRecruit(){const mix=['spear','arch','dao','xbow','cav','spear','fire','mil'];
  for(const id in CG.T){if(!owned(id)||yardLv(id)<1)continue;if(CG.T[id].gov&&CG.T[id].gauto&&CG.T[id].gauto.garr)continue;let guard=0;while(guard++<4){let done=false;const cnt={};for(const u of Object.values(CG.U))cnt[u.type]=(cnt[u.type]||0)+1;

function cbotMarch(){for(const a of CG.armies){const raid=CG.xa.find(x=>x.eta<=1&&(x.to===a.loc||CADJ[a.loc].includes(x.to)));
  const gp=raid?powerOf(null,{type:'def',terr:raid.to}):0;const need=raid&&gp<raid.str*1.2;
